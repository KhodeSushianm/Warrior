name: Build & Test

# Phase 0+ CI (ARCHITECTURE.md sec.16 / PHASES.md): every push/PR must produce
# green unit tests and an installable debug APK artifact. No signing secrets needed.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (wrapper cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          # Optional: only takes effect when the repository secret is configured. An unset secret
          # resolves to an empty string, which setup-gradle treats as "no encryption key".
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :android-app:testDebugUnitTest --stacktrace 2>&1 | tee android-unit-test.log

      - name: Surface Android compiler errors
        if: failure()
        shell: bash
        run: |
          test -f android-unit-test.log || exit 0
          grep -E '(^e: | error: |FAILURE:|What went wrong|Compilation error)' android-unit-test.log \
            | tail -80 \
            | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Android Lint
        run: ./gradlew :android-app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :android-app:assembleDebug --stacktrace

      # Guards the sec.12 requirement that Room schemas are kept in Git. Phase 0 exported them to
      # "$projectDir/../../docs/schemas", i.e. one level ABOVE the repository root, so the JSON was
      # written outside the working tree and never committed. If this step fails, either the schema
      # moved again or a schema change was made without committing the regenerated JSON.
      - name: Verify Room schema is committed and up to date
        run: |
          set -euo pipefail
          SCHEMA_DIR="docs/schemas/com.warrior.tracker.data.local.database.AppDatabase"
          test -f "$SCHEMA_DIR/1.json" || {
            echo "::error::Room schema JSON not found at $SCHEMA_DIR/1.json"
            echo "Check the room.schemaLocation KSP arg in android-app/build.gradle.kts — it must resolve inside the repository."
            exit 1
          }
          if ! git diff --quiet -- docs/schemas; then
            echo "::error::Room schema JSON is stale — regenerate and commit docs/schemas."
            git --no-pager diff --stat -- docs/schemas
            exit 1
          fi
          echo "Room schema committed and up to date."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-app/build/test-results/**/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: warrior-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # The Arena integration cannot download Actions blobs in every sandbox. Publishing from the
      # runner keeps the verified APK byte-for-byte identical to the artifact built above.
      - name: Publish v0.2.0 GitHub Release
        if: github.event_name == 'pull_request' && github.head_ref == 'arena/01a1019a-warrior'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          APK="$(find android-app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          RELEASE_APK="$RUNNER_TEMP/warrior-v0.2.0-debug.apk"
          cp "$APK" "$RELEASE_APK"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Warrior v0.2.0 — Bodyweight Tracking" \
              --notes "Offline bodyweight workout tracking with 19 bilingual exercises, resumable drafts, repetition and timed sets, daily statistics, and recent workout summaries. This is an installable debug-signed APK for Android 8.0 and newer."
          fi
