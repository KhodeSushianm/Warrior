# Project-wide Gradle settings (AGP 8.5 / Kotlin 1.9.24 / Compose)

# AGP 8.5 + KSP + Hilt + the Compose compiler routinely need more than 1 GiB. The Phase-0 value
# (-Xmx1024m combined with kotlin.compiler.execution.strategy=in-process, which runs the Kotlin
# compiler INSIDE this same heap) crashed the daemon with an out-of-memory error part-way through
# :app:mergeExtDexDebug. HeapDumpOnOutOfMemoryError makes a recurrence diagnosable from CI.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m

# Single-module build, so parallelism buys nothing; keeping the Kotlin compiler out of the Gradle
# daemon's heap leaves that heap free for D8/R8.
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=out-of-process
ksp.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
